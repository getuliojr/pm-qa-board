<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Rounded-rect badge background (emerald tint, matches app brand) -->
  <rect width="32" height="32" rx="7" fill="#10b981" fill-opacity="0.18"/>
  <rect width="32" height="32" rx="7" fill="none" stroke="#10b981" stroke-width="1.4" stroke-opacity="0.45"/>
  <!-- Phosphor ph-shield-check — regular weight, scaled & centred in 32×32 grid -->
  <!-- Original Phosphor viewBox 256×256, mapped here to ~22×22 px centred at (16,15) -->
  <g transform="translate(5, 3.5) scale(0.859375)">
    <!-- shield body: M128,24 L36,60 L36,128 C36,188 76,236 128,252 C180,236 220,188 220,128 L220,60 Z -->
    <path d="M12,2.25 L3.375,5.625 L3.375,12
             C3.375,17.625 7.125,22.125 12,23.625
             C16.875,22.125 20.625,17.625 20.625,12 L20.625,5.625 Z"
          fill="#10b981" fill-opacity="0.28"
          stroke="#10b981" stroke-width="1.6"
          stroke-linejoin="round" stroke-linecap="round"/>
    <!-- checkmark: (8,13.5)→(11,16.5)→(16.5,10) -->
    <polyline points="7.5,13 10.5,16 16.5,9.5"
              fill="none" stroke="white" stroke-opacity="0.95"
              stroke-width="2.1"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
