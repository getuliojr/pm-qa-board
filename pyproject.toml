[project]
name = "pm-qa-cockpit"
version = "0.1.0"
description = "PM & QA Cockpit — multi-project story cards, QA and heavy-gate dashboard plus agent skills"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["cockpit", "tests"]
addopts = "-q"
